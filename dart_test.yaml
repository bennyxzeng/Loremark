# Configuration for `flutter test`. See docs/testing.md.
tags:
  # Calls a real LLM provider: needs an API key, costs money, and the output is
  # nondeterministic. Excluded from CI; run by hand with `flutter test --tags live`.
  live:

  # Timing benchmarks on a 500,000-word book (text extraction, the search
  # index, a 20,000-record story model) against the spec's scalability
  # targets. JIT timings on a busy CI runner are noise, so CI skips them; run
  # by hand with `flutter test --tags benchmark`. The numbers in
  # docs/benchmarks.md come from AOT: `dart run tool/benchmark/run.dart`.
  benchmark:

  # Runs the app's EPUB, table-of-contents and search code over a folder of
  # real books (set LOREMARK_CORPUS, see test/corpus/corpus_test.dart and
  # docs/testing.md). Needs the books, so it is skipped everywhere else.
  corpus:
