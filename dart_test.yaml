# Configuration for `flutter test`. See docs/testing.md.
tags:
  # Calls a real LLM provider: needs an API key, costs money, and the output is
  # nondeterministic. Excluded from CI; run by hand with `flutter test --tags live`.
  live:

  # Times a 500,000-word book and a 20,000-record story model against the
  # spec's scalability targets. Takes seconds, but JIT timings on a busy CI
  # runner are noise, so CI skips it; run by hand with
  # `flutter test --tags benchmark`. The numbers in docs/benchmarks.md come
  # from AOT: `dart run tool/benchmark/run.dart`.
  benchmark:
