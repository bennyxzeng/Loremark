# Lints and tests the Flutter app. See docs/testing.md for details.
name: CI

on:
  push:
    # `ui` is our integration branch; checking pushes to it catches PRs that
    # pass on their own but break once merged together.
    branches: [main, ui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the older, now outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Match the SDK revision in .metadata so CI and local runs agree.
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Tests tagged `live` call a real LLM provider and tests tagged
      # `benchmark` time a 500,000-word book; both are run by hand. A boolean
      # tag selector excludes either one (see dart_test.yaml).
      # `--coverage` writes coverage/lcov.info. It only slows the run a little.
      - name: Run tests
        run: flutter test --coverage --exclude-tags "live || benchmark"

      # Shown on the run page. It reports and never fails the build, and it
      # lists the files no test loads, which the percentage cannot count.
      # `if: always()` so a failing test does not hide the numbers.
      - name: Coverage report
        if: always()
        run: dart run tool/coverage/report.dart --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
