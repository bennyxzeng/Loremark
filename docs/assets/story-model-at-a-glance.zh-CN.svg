<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1885" width="1100" height="1885" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arrow-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-e11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker></defs><rect width="1100" height="1885" fill="#ffffff"/><text x="40" y="58" font-size="30" fill="#1f2937" font-weight="800" text-anchor="start">Story model 一图看懂</text><text x="40" y="92.0" font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">以《86—不存在的战区—》第 1–2 章为例。story model ＝ 读到某一节为止，读者知道的所有信息；每一条都能找回原文。</text><rect x="40" y="133.2" width="34" height="34" rx="17" fill="#1f2937" stroke="none" stroke-width="1.5"/><text x="57" y="156.2" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="86" y="157.2" font-size="21" fill="#1f2937" font-weight="700" text-anchor="start">里面有什么：实体、关于实体的说法、原文证据</text><rect x="40" y="185.2" width="1020" height="112" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="60" y="217.2" font-size="17" fill="#1e3a8a" font-weight="700" text-anchor="start">实体：故事里的「谁 / 在哪 / 哪个组织」</text><rect x="60" y="233.2" width="85.52000000000001" height="26" rx="13.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="102.76" y="251.23999999999998" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="middle">人物  Shin</text><rect x="155.52" y="233.2" width="89.02000000000001" height="26" rx="13.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="200.03000000000003" y="251.23999999999998" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="middle">人物  Lena</text><rect x="254.54000000000002" y="233.2" width="100.92000000000002" height="26" rx="13.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="305.0" y="251.23999999999998" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="middle">人物  Raiden</text><rect x="365.46000000000004" y="233.2" width="197.66000000000003" height="26" rx="13.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="464.2900000000001" y="251.23999999999998" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="middle">地点  Eighty-Sixth Sector</text><rect x="573.1200000000001" y="233.2" width="159.72000000000003" height="26" rx="13.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="652.9800000000001" y="251.23999999999998" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="middle">组织  Spearhead 战队</text><text x="60" y="283.2" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">实体本身只有编号和类别（例如 Shin 是 c006）；名字和其他一切信息，都是下面的「说法」。</text><text x="40" y="335.2" font-size="17" fill="#134e4a" font-weight="700" text-anchor="start">说法：一共 7 种，下面全部以 Shin 为例</text><rect x="40.0" y="351.2" width="243.0" height="178.4" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="54.0" y="365.2" width="48" height="26" rx="13.0" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="78.0" y="383.24" font-size="14" fill="#134e4a" font-weight="600" text-anchor="middle">名字</text><text x="56.0" y="413.2" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">这个实体叫什么</text><text x="56.0" y="438.775" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">第 1 章：Undertaker</text><text x="56.0" y="462.525" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">第 2 章：Shinei Nouzen</text><rect x="299.0" y="351.2" width="243.0" height="178.4" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="313.0" y="365.2" width="48" height="26" rx="13.0" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="337.0" y="383.24" font-size="14" fill="#134e4a" font-weight="600" text-anchor="middle">别名</text><text x="315.0" y="413.2" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">同一个实体的其他叫法</text><text x="315.0" y="438.775" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">the Reaper（死神）</text><rect x="558.0" y="351.2" width="243.0" height="178.4" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="572.0" y="365.2" width="48" height="26" rx="13.0" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="596.0" y="383.24" font-size="14" fill="#134e4a" font-weight="600" text-anchor="middle">属性</text><text x="574.0" y="413.2" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">一条特征：标签 = 值</text><text x="574.0" y="438.775" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">age = about to turn sixteen</text><text x="574.0" y="462.525" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">role = Spearhead 战队队长</text><rect x="817.0" y="351.2" width="243.0" height="178.4" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="831.0" y="365.2" width="48" height="26" rx="13.0" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="855.0" y="383.24" font-size="14" fill="#134e4a" font-weight="600" text-anchor="middle">关系</text><text x="833.0" y="413.2" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">A 和 B 的关系，有方向</text><text x="833.0" y="438.775" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">Lena → commands → Shin</text><text x="833.0" y="462.525" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">（Lena 指挥 Shin）</text><rect x="40.0" y="545.6" width="243.0" height="178.4" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="54.0" y="559.6" width="48" height="26" rx="13.0" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="78.0" y="577.64" font-size="14" fill="#134e4a" font-weight="600" text-anchor="middle">事件</text><text x="56.0" y="607.6" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">发生了一件事，按书中讲述的先后</text><text x="56.0" y="627.1750000000001" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">编号</text><text x="56.0" y="652.75" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">第 2 章第 1 件事：Shin 看到</text><text x="56.0" y="674.5" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">Kujo 没写完的倒计时，想起他</text><text x="56.0" y="696.25" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">十天前阵亡</text><rect x="299.0" y="545.6" width="243.0" height="178.4" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="313.0" y="559.6" width="48" height="26" rx="13.0" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="337.0" y="577.64" font-size="14" fill="#134e4a" font-weight="600" text-anchor="middle">疑点</text><text x="315.0" y="607.6" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">文本暂时回答不了的问题</text><text x="315.0" y="633.1750000000001" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">Shin 在战场上寻找的是谁？</text><rect x="558.0" y="545.6" width="243.0" height="178.4" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="572.0" y="559.6" width="76" height="26" rx="13.0" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="610.0" y="577.64" font-size="14" fill="#134e4a" font-weight="600" text-anchor="middle">身份链接</text><text x="574.0" y="607.6" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">两个实体可能其实是同一个</text><text x="574.0" y="633.1750000000001" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">「Lena 的亡父」和「Václav」</text><text x="574.0" y="654.9250000000001" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">是同一个人？（推断）</text><rect x="817.0" y="545.6" width="243.0" height="178.4" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="5 5"/><text x="833.0" y="577.6" font-size="14" fill="#134e4a" font-weight="500" text-anchor="start">说法通过编号指向实体：Shin 一</text><text x="833.0" y="597.9" font-size="14" fill="#134e4a" font-weight="500" text-anchor="start">个人就有 2 个名字、2 个别名、</text><text x="833.0" y="618.2" font-size="14" fill="#134e4a" font-weight="500" text-anchor="start">17 条属性，以及若干关系、事件</text><text x="833.0" y="638.5" font-size="14" fill="#134e4a" font-weight="500" text-anchor="start">和疑点。</text><rect x="40" y="742.0" width="1020" height="92" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="60" y="774.0" font-size="17" fill="#374151" font-weight="700" text-anchor="start">每条说法都附证据：哪一节 ＋ 哪一段 ＋ 一句逐字一致的原文</text><text x="60" y="804.0" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">例：名字「Shinei Nouzen」← 第 2 章（section-005）· 第 p0012 段 · “Shin! Shinei Nouzen! Ya fucked it all up again…”</text><rect x="40" y="868.0" width="34" height="34" rx="17" fill="#1f2937" stroke="none" stroke-width="1.5"/><text x="57" y="891.0" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="86" y="892.0" font-size="21" fill="#1f2937" font-weight="700" text-anchor="start">两个标签：怎么知道的？发生在什么时候？</text><text x="40" y="922.0" font-size="15" fill="#1f2937" font-weight="500" text-anchor="start">关系、事件：两个标签都有；属性、身份链接：只有「怎么知道的」；名字、别名、疑点：没有标签。</text><text x="60.0" y="985.75" font-size="17" fill="#4c1d95" font-weight="700" text-anchor="start">怎么知道的？（assertion）</text><rect x="60.0" y="1003.75" width="71.10000000000001" height="26" rx="13.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="95.55000000000001" y="1021.79" font-size="14" fill="#4c1d95" font-weight="600" text-anchor="middle">explicit</text><text x="190.0" y="1021.75" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">原文直接写明</text><text x="190.0" y="1044.05" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">Shin 是 Spearhead 战队的队长</text><rect x="60.0" y="1075.075" width="81.60000000000001" height="26" rx="13.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="100.80000000000001" y="1093.115" font-size="14" fill="#4c1d95" font-weight="600" text-anchor="middle">reported</text><text x="190.0" y="1093.075" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">某个角色或书中来源说的，可能是假话；会记下是谁</text><text x="190.0" y="1113.375" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">说的</text><text x="190.0" y="1135.675" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">Karlstahl：管制官们叫他「死神」，他会把管制官</text><text x="190.0" y="1156.7" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">「弄坏」</text><rect x="60.0" y="1187.725" width="78.10000000000001" height="26" rx="13.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="99.05000000000001" y="1205.7649999999999" font-size="14" fill="#4c1d95" font-weight="600" text-anchor="middle">inferred</text><text x="190.0" y="1205.725" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">原文没直说，但能合理推出</text><text x="190.0" y="1228.0249999999999" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">Annette 是 Alba（白系种）—— 依据「她的短发是</text><text x="190.0" y="1249.05" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">Alba 的银色」</text><text x="580.0" y="985.75" font-size="17" fill="#7c2d12" font-weight="700" text-anchor="start">发生在什么时候？（temporal_context）</text><rect x="580.0" y="1003.75" width="73.9" height="26" rx="13.0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/><text x="616.95" y="1021.79" font-size="14" fill="#7c2d12" font-weight="600" text-anchor="middle">current</text><text x="710.0" y="1021.75" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">当前剧情</text><text x="710.0" y="1044.05" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">Lena 被任命为 Spearhead 战队的管制官</text><rect x="580.0" y="1075.075" width="50.800000000000004" height="26" rx="13.0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/><text x="605.4" y="1093.115" font-size="14" fill="#7c2d12" font-weight="600" text-anchor="middle">past</text><text x="710.0" y="1093.075" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">过去、回忆、倒叙</text><text x="710.0" y="1115.375" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">九年前，Giad 帝国用 Legion 发动战争</text><rect x="580.0" y="1146.4" width="66.2" height="26" rx="13.0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/><text x="613.1" y="1164.44" font-size="14" fill="#7c2d12" font-weight="600" text-anchor="middle">future</text><text x="710.0" y="1164.4" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">计划、预测、将要发生</text><text x="710.0" y="1186.7" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">共和国认为：两年后 Legion 会全部停机 *</text><rect x="580.0" y="1217.7250000000001" width="105.4" height="26" rx="13.0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/><text x="632.7" y="1235.765" font-size="14" fill="#7c2d12" font-weight="600" text-anchor="middle">hypothetical</text><text x="710.0" y="1235.7250000000001" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">假设、「如果……」</text><text x="710.0" y="1258.025" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">Raiden 心想：Shin 若生在骑士时代，会成为神话</text><text x="710.0" y="1279.0500000000002" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">主角 *</text><rect x="580.0" y="1310.075" width="75.72" height="26" rx="13.0" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/><text x="617.86" y="1328.115" font-size="14" fill="#7c2d12" font-weight="600" text-anchor="middle">unknown</text><text x="710.0" y="1328.075" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">文本没交代是什么时候</text><text x="710.0" y="1350.375" font-size="14.5" fill="#1f2937" font-weight="500" text-anchor="start">（这两章没有出现）</text><rect x="40.0" y="951.75" width="500.0" height="435.6500000000001" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5"/><rect x="560.0" y="951.75" width="500.0" height="435.6500000000001" rx="14" fill="none" stroke="#ea580c" stroke-width="1.5"/><text x="40" y="1409.4" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">两个标签互相独立，可以任意组合：例如「某人讲述的往事」就是 reported ＋ past。带 * 的是示意：原句出自这两章，但当前模型里没有记录这一条。</text><rect x="40" y="1450.9750000000001" width="34" height="34" rx="17" fill="#1f2937" stroke="none" stroke-width="1.5"/><text x="57" y="1473.9750000000001" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="86" y="1474.9750000000001" font-size="21" fill="#1f2937" font-weight="700" text-anchor="start">一节一节往后读：只增加，不删除</text><text x="370" y="1506.9750000000001" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">读完第 1 章（revision 1）</text><text x="850" y="1506.9750000000001" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">读完第 2 章（revision 2）</text><text x="60" y="1554.9750000000001" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start">Shin 的名字</text><rect x="220" y="1530.9750000000001" width="300" height="40" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="370" y="1556.9750000000001" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Undertaker</text><line x1="526" y1="1550.9750000000001" x2="692" y2="1550.9750000000001" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-e11d48)"/><rect x="552.875" y="1522.9750000000001" width="114.25" height="22" rx="11.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/><text x="610.0" y="1538.6550000000002" font-size="13" fill="#881337" font-weight="600" text-anchor="middle">替代 supersede</text><rect x="700" y="1530.9750000000001" width="300" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/><text x="850" y="1556.9750000000001" font-size="15" fill="#134e4a" font-weight="600" text-anchor="middle">Shinei Nouzen</text><text x="60" y="1610.9750000000001" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start">Shin 的年龄</text><rect x="220" y="1586.9750000000001" width="300" height="40" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="370" y="1612.9750000000001" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">a boy roughly Lena’s age</text><line x1="526" y1="1606.9750000000001" x2="692" y2="1606.9750000000001" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-e11d48)"/><rect x="552.875" y="1578.9750000000001" width="114.25" height="22" rx="11.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/><text x="610.0" y="1594.6550000000002" font-size="13" fill="#881337" font-weight="600" text-anchor="middle">替代 supersede</text><rect x="700" y="1586.9750000000001" width="300" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/><text x="850" y="1612.9750000000001" font-size="15" fill="#134e4a" font-weight="600" text-anchor="middle">about to turn sixteen</text><text x="220" y="1646.9750000000001" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start">灰色：旧说法仍保存在文件里，只是已失效</text><text x="700" y="1646.9750000000001" font-size="13.5" fill="#134e4a" font-weight="400" text-anchor="start">绿色：现在有效的说法</text><rect x="40" y="1666.9750000000001" width="1020" height="10" rx="10" fill="none" stroke="none" stroke-width="1.5"/><rect x="60" y="1674.9750000000001" width="121.50000000000001" height="26" rx="13.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/><text x="120.75" y="1693.015" font-size="14" fill="#881337" font-weight="600" text-anchor="middle">替代 supersede</text><text x="195.5" y="1692.9750000000001" font-size="14.5" fill="#1f2937" font-weight="400" text-anchor="start">新说法取代关于同一件事的旧说法，例如上面的改名、年龄更新</text><rect x="60" y="1710.9750000000001" width="106.10000000000001" height="26" rx="13.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/><text x="113.05000000000001" y="1729.015" font-size="14" fill="#881337" font-weight="600" text-anchor="middle">撤回 retract</text><text x="180.10000000000002" y="1728.9750000000001" font-size="14.5" fill="#1f2937" font-weight="400" text-anchor="start">新章节证明旧说法是错的，旧说法作废，没有替代品</text><rect x="60" y="1746.9750000000001" width="102.60000000000001" height="26" rx="13.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/><text x="111.30000000000001" y="1765.015" font-size="14" fill="#881337" font-weight="600" text-anchor="middle">解答 resolve</text><text x="176.60000000000002" y="1764.9750000000001" font-size="14.5" fill="#1f2937" font-weight="400" text-anchor="start">某个疑点有了答案（这两章还没有发生）</text><rect x="40" y="1790.9750000000001" width="1020" height="64" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="60" y="1818.9750000000001" font-size="15" fill="#1e3a8a" font-weight="500" text-anchor="start">旧说法不会被删除，只是不再有效。所以 App 里选第 1 章时 Shin 显示为 Undertaker，选第 2 章时显示为 Shinei Nouzen；也不会提前看到第 2</text><text x="60" y="1840.7250000000001" font-size="15" fill="#1e3a8a" font-weight="500" text-anchor="start">章才出场的 Raiden。</text></svg>
